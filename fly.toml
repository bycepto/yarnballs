app = 'yarnballs-bitter-field-3543'
primary_region = 'ewr'
kill_signal = 'SIGTERM'

[build]
  [build.args]
    APP_HOST = 'yarnballs.ggyo.xyz'

[env]
  APP_HOST = 'yarnballs.ggyo.xyz'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 150
    soft_limit = 100

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
